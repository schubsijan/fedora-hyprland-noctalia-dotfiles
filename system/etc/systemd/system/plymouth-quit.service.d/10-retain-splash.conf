# Splash beim Beenden von Plymouth stehen lassen, bis Hyprland zeichnet (wie GDM es macht).
# Ohne das blitzt zwischen Plymouth und Hyprland kurz die Textkonsole auf – inklusive der
# "Booting `Fedora Linux …'"-Zeile von GRUB, die noch im Bildspeicher steht.
[Service]
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash

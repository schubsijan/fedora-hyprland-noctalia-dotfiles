config_version = 16

[audio]
enable_notification_sounds = false
enable_power_sounds = false
enable_screenshot_sounds = false

[bar.default]
capsule_radius = 4
capsule_thickness = 0.99999998137354851
end = [ "media", "notifications", "network", "bluetooth", "volume", "tray", "battery" ]
margin_edge = 3
margin_ends = 3
padding = 5
radius = 6
radius_bottom_left = 7
radius_bottom_right = 7
radius_top_left = 0
radius_top_right = 0
shadow = false
start = [ "workspaces" ]
thickness = 20

[bluetooth]
connect_when_enabled = true

[calendar]
enabled = true
refresh_minutes = 5

    [calendar.account.personal_google]
    type = "google"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[lockscreen]
transition = [ "disc" ]
transition_duration = 400
wallpaper = "/home/schubsi/Pictures/Wallpapers/fog_forest_bg_2.png"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@Virtual-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 954.00006103515625
    cy = 842.0
    output = "Virtual-1"
    placement_height = 1024.0
    placement_width = 1908.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@Virtual-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 128.0
    box_width = 810.0
    cx = 800.00006103515625
    cy = 748.33331298828125
    output = "eDP-1"
    placement_height = 900.0
    placement_width = 1600.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = true
        input_opacity = 1.0
        input_radius = 5.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = false
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 64.0
    box_width = 144.0
    cx = 800.0
    cy = 450.0
    output = "eDP-1"
    placement_height = 900.0
    placement_width = 1600.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = true
        background_padding = 0

[notification]
border_width = 0.0

[osd.kinds]
media = false

[plugins]
enabled = [ "kenn/keybind-cheatsheet", "schubsi/pkg-menu" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "/home/schubsi/.config/noctalia/plugins"
    name = "local"

[shell]
corner_radius_scale = 0.2500000037252903
lang = "de"

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    categories = false
    compact = true
    layout = "simple"

[theme]
builtin = "Nord"
community_palette = "Everforest"
mode = "dark"
source = "community"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt" ]
    community_ids = [
        "claude-code",
        "chromium-based",
        "libreoffice",
        "neovim",
        "obsidian",
        "prismlauncher",
        "obs",
        "thunar",
        "bat",
        "fzf"
    ]

[wallpaper.default]
path = "/home/schubsi/Pictures/Wallpapers/fog_forest_bg_2.png"

[wallpaper.last]
path = "/home/schubsi/Pictures/Wallpapers/fog_forest_bg_2.png"

[wallpaper.monitors.eDP-1]
path = "/home/schubsi/Pictures/Wallpapers/fog_forest_bg_2.png"

[weather]
enabled = false

[widget.battery]
display_mode = "none"

[widget.clock]
font_scale = 0.94999999999999996
format = "{:%a %-d. %B %-H:%M}"
timezone = "Europe/Berlin"

[widget.media]
hide_when_no_media = true

    [widget.media.actions]
    scroll_down = "volume-down 1"
    scroll_up = "volume-up 1"

[widget.volume]
mute_color = "secondary"

[widget.workspaces]
active_pill_size = 0.25
occupied_color = "on_primary"
pill_scale = 0.90000000000000002